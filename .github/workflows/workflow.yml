name: Deploy to GitHub Pages

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy assets into static
        run: |
          mkdir -p static
          cp -r opd bd web zip discrete_math_2sem templates static/ 2>/dev/null || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: static

      - id: deployment
        uses: actions/deploy-pages@v4
